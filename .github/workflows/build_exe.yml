name: Build and Release .exe

# Triggers on version tags like v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Check out source ───────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies + PyInstaller ─────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber openpyxl xlrd pyinstaller
          
      # ── 3b. Patch version.txt ─────────────────────────────────────────────
      - name: Patch version.txt
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $parts = $tag.Split(".")
          $v = "$($parts[0]), $($parts[1]), $($parts[2]), 0"
          $vs = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          (Get-Content version.txt) -replace "\(\d+, \d+, \d+, \d+\)", "($v)" | Set-Content version.txt
          (Get-Content version.txt) -replace "\d+\.\d+\.\d+\.0", "$vs" | Set-Content version.txt

      # ── 4. Build the executable ───────────────────────────────────────────
      # --onefile        : single self-contained .exe
      # --console        : keep the console window (this is a CLI tool)
      # --name           : output filename
      # --hidden-import  : modules pdfplumber loads at runtime that
      #                    PyInstaller's static analysis misses
      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name t3_compute `
            --version-file version.txt `
            --add-data "version.txt;." `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --hidden-import t3_gui `
            --hidden-import t3_colors `
            --hidden-import parse_t3_pdfs `
            --hidden-import update_acb `
            --hidden-import build_assets `
            --hidden-import compute_t3 `
            --hidden-import pdfplumber `
            --hidden-import pdfminer `
            --hidden-import pdfminer.high_level `
            --hidden-import pdfminer.layout `
            --hidden-import pdfminer.pdfparser `
            --hidden-import pdfminer.pdfdocument `
            --hidden-import pdfminer.pdfpage `
            --hidden-import pdfminer.converter `
            --hidden-import pdfminer.pdfinterp `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            run_t3.py

      # ── 5. Bundle exe + templates + quick start into a zip ───────────────
      - name: Create release ZIP
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "t3_compute_$version.zip"

          # Collect everything the user needs into a staging folder
          New-Item -ItemType Directory -Path release_staging

          Copy-Item dist\t3_compute.exe              release_staging\
          Copy-Item README.FIRST.txt                 release_staging\
          Copy-Item acb_worksheet_template.xlsx      release_staging\
          Copy-Item version.txt release_staging\

          Compress-Archive -Path release_staging\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ── 6. Compute SHA-256 of the exe (listed in release notes) ──────────
      - name: Compute SHA-256
        id: hash
        run: |
          $hash = (Get-FileHash dist\t3_compute.exe -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA-256: $hash"

      # ── 7. Create GitHub Release and upload the zip ───────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## T3 Compute ${{ github.ref_name }}

            ### Download
            - **[t3_compute_${{ github.ref_name }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/t3_compute_${{ github.ref_name }}.zip)** — Windows standalone bundle (no Python required)
            - **[setup.bat](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/setup.bat)** — Python users: download this + the source ZIP below, run `setup.bat` to install dependencies

            **What's in the ZIP:**
            `t3_compute.exe`, `README.FIRST.txt`, config templates, ACB spreadsheet template, `README.md`, `BUILD_EXE.md`

            **Getting started (no Python):** unzip anywhere, read `README.FIRST.txt`, fill in the config files, run `t3_compute.exe`.

            **Getting started (Python):** download source ZIP + `setup.bat`, extract, double-click `setup.bat`.

            ### SmartScreen warning
            Windows may show "Windows protected your PC" when you run this file.
            Click **More info → Run anyway**. This warning appears because the
            executable is not signed with a paid EV code signing certificate.
            See [BUILD_EXE.md](https://github.com/${{ github.repository }}/blob/main/BUILD_EXE.md)
            for details, or build the .exe yourself from source.

            ### Verify exe integrity (optional)
            ```
            certutil -hashfile t3_compute.exe SHA256
            ```
            Expected: `${{ steps.hash.outputs.sha256 }}`

            ### Python source
            Download the source ZIP below and run `setup.bat` or `python run_t3.py` directly.
          files: |
            ${{ env.ZIP_NAME }}
            setup.bat
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
