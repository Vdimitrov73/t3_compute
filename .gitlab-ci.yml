workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - build
  - release

build-exe:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - python --version
    - python -m venv build_env
    - 'build_env\Scripts\activate'
    - pip install pdfplumber openpyxl xlrd pyinstaller
    - '$tag = $env:CI_COMMIT_TAG -replace "^v",""'
    - '$parts = $tag.Split(".")'
    - '$v = "$($parts[0]), $($parts[1]), $($parts[2]), 0"'
    - '(Get-Content version.txt) -replace "\(\d+, \d+, \d+, \d+\)", "($v)" | Set-Content version.txt' 
    - 'pyinstaller --onefile --console --name t3_compute --hidden-import pdfplumber --hidden-import pdfminer --hidden-import pdfminer.high_level --hidden-import pdfminer.layout --hidden-import pdfminer.pdfparser --hidden-import pdfminer.pdfdocument --hidden-import pdfminer.pdfpage --hidden-import pdfminer.converter --hidden-import pdfminer.pdfinterp --hidden-import openpyxl --hidden-import xlrd --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import tkinter.scrolledtext --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox --hidden-import t3_gui --hidden-import t3_colors --hidden-import parse_t3_pdfs --hidden-import update_acb --hidden-import build_assets --hidden-import compute_t3 --version-file version.txt run_t3.py'
    - '$hash = (Get-FileHash dist\t3_compute.exe -Algorithm SHA256).Hash.ToLower()'
    - 'echo "SHA256=$hash" | Out-File -FilePath build.env -Encoding utf8 -Append'
    - '$version = $env:CI_COMMIT_TAG'
    - '$zipName = "t3_compute_${version}.zip"'
    - 'echo "ZIP_NAME=$zipName" | Out-File -FilePath build.env -Encoding utf8 -Append'
    - 'New-Item -ItemType Directory -Path release_staging'
    - 'Copy-Item dist\t3_compute.exe release_staging\'
    - 'Copy-Item README.FIRST.txt release_staging\'
    - 'Copy-Item acb_worksheet_template.xlsx release_staging\'
    - 'Copy-Item version.txt release_staging\'
    - 'Compress-Archive -Path release_staging\* -DestinationPath $zipName'
  artifacts:
    paths:
      - dist/t3_compute.exe
      - "t3_compute_*.zip"
      - setup.bat
    reports:
      dotenv: build.env
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-exe
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    name: "$CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## T3 Compute $CI_COMMIT_TAG

      ### Download
      - **t3_compute_$CI_COMMIT_TAG.zip** - Windows standalone bundle (no Python required)
      - **setup.bat** - Python users: download this + the source ZIP, run setup.bat

      Getting started (no Python): unzip anywhere, read README.FIRST.txt, run t3_compute.exe.
      Getting started (Python): download source ZIP + setup.bat, extract, double-click setup.bat.

      SmartScreen warning: click More info then Run anyway.

      SHA256: $SHA256
    assets:
      links:
        - name: "t3_compute_$CI_COMMIT_TAG.zip"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/t3_compute_$CI_COMMIT_TAG.zip?job=build-exe"
          link_type: package
        - name: "setup.bat"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/setup.bat?job=build-exe"
          link_type: other
